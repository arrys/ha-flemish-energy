stages:
  - verify
  - build
  - publish

default:
  image: python:3.14-slim

verify:
  stage: verify
  script:
    - python -m unittest discover -s tests

pages:
  stage: publish
  script:
    - python -m pip install mkdocs==1.6.1
    - python -m mkdocs build --strict --site-dir public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:
  stage: build
  script:
    - python -c 'import json, os; from pathlib import Path; manifest = json.loads(Path("custom_components/flemish_energy/manifest.json").read_text(encoding="utf-8")); assert os.environ["CI_COMMIT_TAG"] == "v" + manifest["version"], "Tag must match the integration version"'
    - mkdir -p dist
    - python -m zipfile -c "dist/ha-flemish-energy-${CI_COMMIT_TAG}.zip" custom_components/flemish_energy
    - python -m zipfile -t "dist/ha-flemish-energy-${CI_COMMIT_TAG}.zip"
  artifacts:
    expire_in: never
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: package
      artifacts: false
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    name: 'Flemish Energy $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: docs/changelog.md
    assets:
      links:
        - name: 'Home Assistant integration ZIP'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/ha-flemish-energy-${CI_COMMIT_TAG}.zip?job=package'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
